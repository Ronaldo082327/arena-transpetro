<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf3ea"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>Estúdio Cesgranrio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Estúdio Cesgranrio: videoaulas animadas, métodos, mapas mentais, esquemas e flashcards gerados dos guias (expedicao/*.json). */
:root{
  --bg:#fbf3ea; --paper:#fffaf4; --ink:#3b2a1d; --muted:#7c6553; --line:#eddcc9;
  --accent:#c8641f; --accent-soft:#fde8d6; --warn:#a96400; --warn-soft:#fbecd4;
  --bad:#b0413a; --bad-soft:#fbe3df; --ok:#2f7a45; --ok-soft:#e3f2e6; --on-accent:#ffffff; --gold:#9a6a00; --gold-soft:#fbefd2;
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 8px 22px rgba(176,108,52,.13),0 1px 3px rgba(176,108,52,.12);
  --shadow-lg:0 1px 0 rgba(255,255,255,.9) inset,0 18px 40px rgba(176,108,52,.18),0 2px 6px rgba(176,108,52,.12);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
/* Visual pedido pelo Ronaldo: claro, laranja suave, com relevo. O modo escuro só existe se escolhido explicitamente. */
:root[data-theme="dark"]{
  --bg:#2a211b; --paper:#352a22; --ink:#f6ebe0; --muted:#cdb7a4; --line:#4a3b30;
  --accent:#f0a062; --accent-soft:#4a3426; --warn:#e3a54b; --warn-soft:#3a2c14;
  --bad:#ec8b81; --bad-soft:#3d1f1c; --ok:#7fc794; --ok-soft:#183324; --on-accent:#2a211b; --gold:#e6b84a; --gold-soft:#3a2c14;
  --shadow:0 6px 18px rgba(0,0,0,.3); --shadow-lg:0 14px 36px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{background:radial-gradient(1200px 600px at 10% -10%,#ffe3c8 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#ffeedd 0,transparent 55%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 72px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,6vw,52px)} h2{font-size:clamp(24px,4vw,32px)} h3{font-size:20px} h4{font-size:17px}
p{margin:0}
a{color:var(--accent)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13.5px;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,select{font-family:var(--body);font-size:14px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 14px}
button{cursor:pointer;touch-action:manipulation}
button.primary{background:linear-gradient(180deg,#e2803b,var(--accent));box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 4px 12px rgba(200,100,31,.3);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.ghost{background:none}
button:focus-visible,select:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.top{position:sticky;top:0;z-index:8;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);box-shadow:0 4px 16px rgba(176,108,52,.10);border-bottom:1px solid var(--line);
  margin:0 calc(-1*max(16px,env(safe-area-inset-right,0px))) 0 calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.top .in{max-width:1040px;margin:0 auto;display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.brand{font-family:var(--display);font-weight:700;font-size:19px;color:var(--accent);text-decoration:none;white-space:nowrap;margin-right:6px}
.top nav{display:flex;gap:6px}
.top nav a{flex:0 0 auto;font-family:var(--mono);font-size:12px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);color:var(--muted);text-decoration:none;white-space:nowrap}
.top nav a[aria-current="page"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.hero{padding:24px 0 8px;display:grid;gap:8px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:12px}
.card{all:unset;cursor:pointer;background:linear-gradient(180deg,#fffdf9,var(--paper));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:grid;gap:6px;align-content:start;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card .ic{font-size:28px;line-height:1}
.card .tag{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.card.big{padding:20px}
.discs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;margin-top:12px}
.discs button{flex:0 0 auto;border-radius:99px;font-size:13px;padding:6px 12px}
.discs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.vlist{display:grid;gap:8px;margin-top:10px}
.vitem{all:unset;cursor:pointer;display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);box-shadow:var(--shadow)}
.vitem:hover{border-color:var(--accent)}
.vitem:focus-visible{outline:2px solid var(--accent)}
.thumb{width:70px;aspect-ratio:16/9;border-radius:9px;display:grid;place-items:center;font-size:18px;color:#3b2a1d;background:linear-gradient(135deg,#fff3e6,color-mix(in srgb,var(--c,#e8803a) 55%,#fff));box-shadow:0 3px 8px rgba(176,108,52,.2);position:relative}
.thumb::after{content:"▶";position:absolute;right:4px;bottom:2px;font-size:10px;opacity:.85}
.vitem .d{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.vitem.seen .thumb{outline:2px solid var(--gold)}

/* ===== Player de videoaula ===== */
.player{margin-top:14px;border-radius:14px;overflow:hidden;background:#06131a;border:1px solid var(--line)}
.player:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0}
.viewport{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#06131a}
.player:fullscreen .viewport{max-height:calc(100vh - 64px);aspect-ratio:auto;flex:1}
.stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;color:#eaf4f6;font-family:var(--body);
  background:radial-gradient(ellipse at 20% 10%,color-mix(in srgb,var(--c) 38%,#0b1e26),#06131a 70%);overflow:hidden}
.stage .bgwave{position:absolute;left:-10%;right:-10%;bottom:-40px;height:260px;opacity:.18;animation:drift 18s linear infinite}
.stage .orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.35;background:var(--c);animation:float 14s ease-in-out infinite}
@keyframes drift{to{transform:translateX(-12%)}}
@keyframes float{50%{transform:translate(40px,-30px) scale(1.1)}}
.stage.paused *{animation-play-state:paused!important}
.stage.measure,.stage.measure *{transition:none!important}
.stage .hud{position:absolute;left:56px;right:56px;top:34px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,#eaf4f6 65%,transparent);z-index:2}
.stage .hud b{color:var(--c);font-weight:500}
.scene{position:absolute;inset:0;padding:96px 72px 70px;display:flex;flex-direction:column;gap:22px;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
.scene.on{opacity:1;visibility:visible}
.scene h2{font-size:58px;color:#fff;font-weight:700;letter-spacing:.01em}
.scene .kick{font-family:var(--mono);font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.rv{opacity:0;transform:translateY(22px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.pop{transform:scale(.6)} .rv.pop.in{transform:none}
.rv.left{transform:translateX(-50px)} .rv.left.in{transform:none}
.fit{flex:1;min-height:0;overflow:hidden}
.s-open{align-items:center;justify-content:center;text-align:center}
.s-open h2{font-size:76px;max-width:1080px}
.s-open .sub{font-size:28px;color:#b9d2d8;max-width:980px}
.emblem{width:210px;height:210px}
.emblem .spin{animation:spin 16s linear infinite;transform-origin:105px 105px}
@keyframes spin{to{transform:rotate(360deg)}}
.bul{display:grid;gap:16px;margin:0;padding:0;list-style:none;font-size:30px;line-height:1.35}
.bul li{display:grid;grid-template-columns:34px 1fr;gap:14px}
.bul li::before{content:"";width:16px;height:16px;margin-top:.45em;border-radius:4px;background:var(--c);transform:rotate(45deg)}
.big-text{font-size:34px;line-height:1.4}
.hl{background:color-mix(in srgb,var(--c) 30%,transparent);border-radius:6px;padding:0 6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.paper{background:#f7f4ea;color:#1b2326;border-radius:16px;padding:28px 34px;box-shadow:0 20px 60px rgba(0,0,0,.45);font-family:"IBM Plex Sans",serif;font-size:27px;line-height:1.45}
.paper .src{font-family:var(--mono);font-size:16px;color:#8a6200;margin-bottom:8px;display:block}
.flowv{display:grid;gap:12px;align-content:start}
.flowv.two{grid-template-columns:1fr 1fr;column-gap:30px}
.fstep{display:grid;grid-template-columns:52px 1fr;gap:16px;align-items:start;font-size:27px;line-height:1.3;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 16px}
.fstep .n{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#06131a;font-family:var(--display);font-weight:700;font-size:26px}
.fstep.in{box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 70%,transparent)}
.danger{border:3px solid #ff8f84;background:rgba(255,143,132,.12);border-radius:20px;padding:30px 34px;font-size:32px;line-height:1.4;display:grid;grid-template-columns:120px 1fr;gap:26px;align-items:center}
.danger .x{font-size:110px;line-height:1;color:#ff8f84;text-align:center}
.danger .x.in{animation:shake .6s .2s}
@keyframes shake{20%,60%{transform:translateX(-10px) rotate(-6deg)}40%,80%{transform:translateX(10px) rotate(6deg)}}
.goldcard{border:3px solid #f2c14e;background:rgba(242,193,78,.12);border-radius:22px;padding:36px 40px;font-family:var(--display);font-size:46px;line-height:1.2;color:#fff;box-shadow:0 0 80px rgba(242,193,78,.25)}
.chips{display:flex;flex-wrap:wrap;gap:14px}
.chip{border:2px solid var(--c);border-radius:99px;padding:10px 22px;font-size:26px;background:rgba(255,255,255,.05)}
.bubble2{align-self:flex-start;max-width:92%;background:#fff;color:#14232a;border-radius:24px 24px 24px 6px;padding:16px 26px;font-size:30px;font-style:italic;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.bubble2::before{content:"BANCA";display:block;font-style:normal;font-family:var(--mono);font-size:14px;letter-spacing:.14em;color:#0d5b6b}
.gaugev{display:flex;gap:40px;align-items:center}
.alts2{display:grid;gap:10px;font-size:23px;line-height:1.3}
.alt2{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);position:relative;transition:opacity .5s,background .5s,border-color .5s}
.alt2 .k{font-family:var(--display);font-weight:700;font-size:28px;color:var(--c)}
.alt2 .why{grid-column:2;font-size:19px;color:#ffb3ab;max-height:0;overflow:hidden;transition:max-height .6s}
.alt2.x{opacity:.55;background:rgba(255,143,132,.08);border-color:rgba(255,143,132,.5)}
.alt2.x .txt{text-decoration:line-through;text-decoration-color:#ff8f84;text-decoration-thickness:3px}
.alt2.x .why{max-height:120px}
.alt2.win{background:rgba(127,220,156,.18);border-color:#7fdc9c;box-shadow:0 0 30px rgba(127,220,156,.35);opacity:1}
.qstem{font-size:25px;line-height:1.35;background:rgba(255,255,255,.05);border-left:5px solid var(--c);border-radius:8px;padding:12px 18px}
.qsrc{font-family:var(--mono);font-size:16px;color:#f2c14e}
.fc3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;flex:1;min-height:0}
.fc{perspective:900px}
.fc .in2{position:relative;height:100%;transition:transform .8s;transform-style:preserve-3d}
.fc.flipped .in2{transform:rotateY(180deg)}
.fc .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:24px;display:grid;align-content:center;font-size:25px;line-height:1.3;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);overflow:hidden}
.fc .b{transform:rotateY(180deg);background:color-mix(in srgb,var(--c) 22%,#0b1e26);border-color:var(--c)}
.player.portrait .viewport{aspect-ratio:4/5}
.player.portrait .stage{width:720px;height:900px}
.player.portrait .scene{padding:92px 40px 48px;gap:18px}
.player.portrait .hud{left:40px;right:40px;font-size:15px}
.player.portrait .scene h2{font-size:50px}
.player.portrait .fc3{grid-template-columns:1fr;gap:14px}
.player.portrait .flowv.two{grid-template-columns:1fr}
.player.portrait .danger{grid-template-columns:1fr;gap:10px}
.player.portrait .danger .x{font-size:70px}
.player.portrait .gaugev{flex-direction:column;gap:18px;align-items:center}
.player.portrait .gaugev>div{text-align:center!important}
.player.portrait .emblem{width:170px;height:170px}
.caption{background:#081820;color:#f1f7f8;font-size:15.5px;line-height:1.45;padding:8px 14px;text-align:center;min-height:3.2em;display:flex;align-items:center;justify-content:center;border-top:1px solid rgba(255,255,255,.08)}
.caption.off{display:none}
.bigplay[hidden]{display:none}
.bigplay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35);border:0;border-radius:0;color:#fff;font-size:20px;z-index:6;cursor:pointer}
.bigplay span{width:84px;height:84px;border-radius:50%;background:var(--c,#5fb6c6);display:grid;place-items:center;font-size:34px;color:#06131a;box-shadow:0 0 40px rgba(0,0,0,.5)}
.endcard{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,19,26,.88);z-index:7;color:#fff;text-align:center;padding:16px}
.endcard[hidden]{display:none}
.controls{display:flex;gap:6px;align-items:center;padding:8px 10px;background:#0b1e26;color:#d6e6ea;flex-wrap:wrap}
.controls button,.controls select{background:transparent;border:1px solid rgba(255,255,255,.18);color:#d6e6ea;padding:6px 10px;font-size:13px;border-radius:8px}
.controls .time{font-family:var(--mono);font-size:12px;white-space:nowrap}
.scrub{position:relative;flex:1 1 160px;height:22px;display:flex;align-items:center;cursor:pointer;min-width:120px}
.scrub .track{position:absolute;left:0;right:0;height:5px;border-radius:99px;background:rgba(255,255,255,.18)}
.scrub .fill{position:absolute;left:0;height:5px;border-radius:99px;background:var(--c,#5fb6c6);width:0}
.scrub .tick{position:absolute;top:4px;width:2px;height:14px;background:rgba(255,255,255,.45)}
.chapters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 10px;background:#0b1e26;border-top:1px solid rgba(255,255,255,.08)}
.chapters button{flex:0 0 auto;background:transparent;border:1px solid rgba(255,255,255,.15);color:#a9c3c9;font-family:var(--mono);font-size:11.5px;padding:4px 10px;border-radius:99px}
.chapters button.cur{color:#06131a;background:var(--c,#5fb6c6);border-color:var(--c,#5fb6c6)}


/* Quadro claro das videoaulas (sem fundo escuro) */
.player{background:#fff7ef;box-shadow:var(--shadow-lg);border-radius:18px}
.viewport{background:#fff7ef}
.stage{color:#3b2a1d;background:radial-gradient(ellipse at 15% 0%,color-mix(in srgb,var(--c) 30%,#fff7ef),#fff7ef 55%),linear-gradient(160deg,#fffaf3,#fde9d6)}
.stage .orb{opacity:.28}
.stage .bgwave{opacity:.22}
.stage .hud{color:#9a7b62}
.scene h2{color:#3b2a1d}
.scene .kick{color:color-mix(in srgb,var(--c) 55%,#7a4a1c)}
.s-open .sub{color:#7c6553}
.hl{background:color-mix(in srgb,var(--c) 35%,#fff)}
.fstep{background:#fffdf9;border-color:#f0dcc6;box-shadow:0 6px 16px rgba(176,108,52,.12)}
.fstep .n{color:#fff;background:color-mix(in srgb,var(--c) 70%,#a0521a)}
.danger{background:#fff1ee;color:#5a2a24}
.goldcard{background:#fff6dc;color:#3b2a1d;box-shadow:0 18px 50px rgba(200,140,40,.25)}
.chip{background:#fffdf9;color:#3b2a1d}
.bubble2{box-shadow:0 12px 30px rgba(176,108,52,.2)}
.qstem{background:#fffdf9;box-shadow:0 6px 16px rgba(176,108,52,.1)}
.qsrc{color:#9a6a00}
.alt2{background:#fffdf9;border-color:#f0dcc6}
.alt2 .k{color:color-mix(in srgb,var(--c) 60%,#7a4a1c)}
.alt2 .why{color:#b0413a}
.alt2.x{background:#fff1ee;border-color:#f3b8ae}
.alt2.win{background:#e6f6ea;border-color:#55b070;box-shadow:0 0 30px rgba(85,176,112,.35)}
.fc .f{background:#fffdf9;border-color:#f0dcc6;color:#3b2a1d}
.fc .b{background:color-mix(in srgb,var(--c) 22%,#fff);color:#3b2a1d}
.caption{background:#fff1e3;color:#3b2a1d;border-top:1px solid #f0dcc6}
.controls{background:#fbe9d8;color:#5a4232}
.controls button,.controls select{border-color:#e9cdb1;color:#5a4232;background:#fffaf4}
.scrub .track{background:#ecd3bb}
.chapters{background:#fbe9d8;border-top-color:#f0dcc6}
.chapters button{border-color:#e9cdb1;color:#7c6553;background:#fffaf4}
.endcard{background:rgba(255,247,239,.94);color:#3b2a1d}
.endcard p{color:#7c6553!important}
/* ===== Métodos (fluxogramas) ===== */
.method{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--paper);box-shadow:var(--shadow);margin-top:12px;display:grid;gap:12px}
.flow{display:grid;gap:0;justify-items:stretch}
.fn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg);display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.fn .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-family:var(--mono);font-size:12px}
.fn.start{border-color:var(--accent);background:var(--accent-soft);grid-template-columns:1fr}
.fn.end{border-color:var(--bad);background:var(--bad-soft);grid-template-columns:1fr}
.arrow{height:22px;display:grid;place-items:center;color:var(--muted);font-size:14px;line-height:1}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:2px}
.fn.end .lbl{color:var(--bad)}
details.ex{border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
details.ex summary{cursor:pointer;font-size:13.5px;color:var(--accent)}
mark.trp{background:var(--gold-soft);color:var(--gold);border-radius:4px;padding:0 4px}
.tec{font-family:var(--mono);font-size:.8em;color:var(--muted);white-space:nowrap}
code{font-family:var(--mono);font-size:.88em;background:var(--accent-soft);padding:1px 5px;border-radius:5px}

/* ===== Mapa mental ===== */
.mmwrap{position:relative;margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--paper);overflow:hidden;height:min(72vh,720px);min-height:420px;touch-action:none}
.mmwrap svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
.mmwrap svg.drag{cursor:grabbing}
.mmtools{position:absolute;right:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
.mmtools button{padding:6px 10px;font-size:13px}
.drawer{position:absolute;left:10px;right:10px;bottom:10px;max-height:45%;overflow:auto;background:var(--paper);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.drawer[hidden]{display:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ===== Esquemas ===== */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:12px}
.tabs button{flex:0 0 auto;border-radius:99px;font-family:var(--mono);font-size:12px;padding:6px 12px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.duels{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:12px}
.duel{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow);display:grid}
.duel .sides{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:relative}
.duel .side{padding:12px 14px;display:grid;gap:4px;align-content:start}
.duel .side:nth-child(odd){background:var(--accent-soft)} .duel .side:nth-child(even){background:var(--gold-soft)}
.duel .side b{font-family:var(--display);font-size:19px;line-height:1.15}
.duel .side p{font-size:13.5px}
.duel .sides.two .side:first-child{padding-right:24px}.duel .sides.two .side:last-child{padding-left:24px}
.duel .vsb{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:700;font-size:14px}
.duel .dist{padding:10px 14px;font-size:14px;border-top:1px solid var(--line)}
.duel .src{padding:6px 14px 10px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:12px}
.lcard{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--paper);box-shadow:var(--shadow);display:grid;gap:8px;align-content:start}
.lcard .gat{font-size:13px;border-left:3px solid var(--gold);padding-left:8px;color:var(--muted)}
.lcard .gat b{color:var(--gold);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:block}
.lcard ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.md{display:grid;gap:8px;font-size:14px}
.md table{border-collapse:collapse;width:100%;font-size:13px}
.md .tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.md th,.md td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.md th{background:var(--accent-soft);font-family:var(--mono);font-size:11px;text-transform:uppercase}
.md ul,.md ol{margin:0;padding-left:20px}
.check{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.check li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);cursor:pointer}
.check li .bx{width:20px;height:20px;border:2px solid var(--accent);border-radius:5px;display:grid;place-items:center;font-size:13px;color:var(--on-accent)}
.check li.on .bx{background:var(--accent)}
.check li.on{opacity:.6}

/* ===== Flashcards ===== */
.fcard{perspective:1200px;margin-top:14px;cursor:pointer}
.fcard .inner{position:relative;min-height:260px;transition:transform .5s;transform-style:preserve-3d}
.fcard.on .inner{transform:rotateY(180deg)}
.fcard .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;align-content:center;gap:10px;background:var(--paper);overflow:auto}
.fcard .face.back{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent)}
.fcard .face .q{font-size:19px;line-height:1.45}
.fcard .face ol{margin:0;padding-left:22px;display:grid;gap:4px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.grade button{padding:12px 6px}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.toggles label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;background:var(--paper)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(100px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-family:var(--mono);font-size:13px;transition:transform .3s,opacity .3s;z-index:30;max-width:calc(100vw - 32px);text-align:center}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px}

/* ===== Inteligência ===== */
.bigplay{background:rgba(255,247,239,.45)!important}
.geo-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-top:12px;align-items:start}
.geomap{height:min(70vh,640px);min-height:380px;border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow-lg);overflow:hidden;z-index:0}
.geo-panel{margin-top:0;max-height:min(70vh,640px);overflow:auto}
.pin{width:42px;height:42px;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);background:linear-gradient(135deg,#fff,color-mix(in srgb,var(--c) 60%,#fff));border:2px solid #c8641f;box-shadow:0 6px 14px rgba(176,108,52,.35);display:grid;place-items:center}
.pin span{transform:rotate(45deg);font-size:20px}
.stat-pill{background:var(--accent-soft);border-radius:99px;padding:4px 12px;font-size:13px}
.stat-pill b{font-family:var(--display);font-size:18px;margin-right:3px}
.mini{margin:6px 0 0;padding-left:18px;display:grid;gap:5px;font-size:13.5px}
.mac-mini{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:10px 12px;font-family:var(--display);font-size:18px;line-height:1.25}
.btnlink{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;padding:9px 14px;background:var(--paper);color:var(--ink);text-decoration:none;font-size:14px}
.satbox iframe{width:100%;height:260px;border:0;border-radius:12px;margin:8px 0}
.lab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.lab-grid>.panel{margin-top:14px}
.sig{display:grid;gap:7px;margin-top:10px}
.sigrow{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr 92px;gap:10px;align-items:center;font-size:13.5px}
.sigbar{position:relative;height:12px;border-radius:99px;background:var(--line);overflow:visible}
.sigbar i{display:block;height:100%;border-radius:99px}
.sigbar em{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--ink);opacity:.45}
.letters{display:flex;gap:14px;align-items:flex-end;height:150px;margin:12px 0 6px}
.letters>div{display:grid;justify-items:center;gap:3px;flex:1}
.lb{width:100%;max-width:46px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#f2a066,var(--accent));box-shadow:var(--shadow)}
.myths{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:10px}
.myth{border-radius:14px;padding:12px 14px;display:grid;gap:6px;border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow)}
.myth .tag2{justify-self:start;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:2px 9px}
.myth.ok .tag2{background:var(--ok-soft);color:var(--ok)} .myth.bad .tag2{background:var(--bad-soft);color:var(--bad)} .myth.warn .tag2{background:var(--warn-soft);color:var(--warn)}
.trow{display:grid;grid-template-columns:1fr 54px 60px;gap:8px;font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
.linkish{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.linkish:focus-visible{outline:2px solid var(--accent)}
textarea{width:100%;font-family:var(--body);font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);margin-top:8px;box-shadow:inset 0 2px 4px rgba(176,108,52,.08)}
input[type=password],input[type=text]{font-family:var(--body);font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink)}
mark.sg{border-radius:4px;padding:0 3px} mark.sg.bad{background:var(--bad-soft);color:var(--bad)} mark.sg.ok{background:var(--ok-soft);color:var(--ok)} mark.sg.warn{background:var(--warn-soft);color:var(--warn)}
.scanline{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.conv{display:grid;gap:10px;margin-top:10px}
.convrow{display:grid;grid-template-columns:1fr 26px 1.2fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:linear-gradient(90deg,#fff7ef,var(--paper));box-shadow:var(--shadow)}
.convrow>div{display:grid;gap:3px}
.convrow .arrowr{font-size:22px;color:var(--accent);text-align:center}
.force{justify-items:end;color:var(--accent);font-size:16px;letter-spacing:2px}
.facts2{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:10px}
.fact2{display:grid;gap:6px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper);color:var(--ink);text-decoration:none;box-shadow:var(--shadow)}
.fact2:hover{border-color:var(--accent)}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:10px}
.vocab div{display:grid;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--paper)}
.gq{border:1px solid var(--accent);border-radius:16px;padding:16px;background:linear-gradient(180deg,#fff7ef,var(--paper));box-shadow:var(--shadow-lg)}
.galts{display:grid;gap:8px}
.galt{text-align:left;border-radius:10px}
.galt.ok{border-color:var(--ok);background:var(--ok-soft)} .galt.bad{border-color:var(--bad);background:var(--bad-soft)} .galt.dim{opacity:.55}
@media (max-width:900px){.geo-grid{grid-template-columns:1fr}.geo-panel{max-height:none}.convrow{grid-template-columns:1fr}.convrow .arrowr{transform:rotate(90deg)}.force{justify-items:start}}
@media (max-width:560px){.sigrow{grid-template-columns:1fr 64px}.sigrow .sigbar{grid-column:1/-1;grid-row:2}}
@media (max-width:560px){.vitem{grid-template-columns:56px 1fr}.vitem .d{grid-column:2}.thumb{width:56px}.duels,.lists{grid-template-columns:1fr}.controls .hide-sm{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

<div class="wrap"><main id="app" aria-live="polite"><p class="note" style="padding:40px 0">Abrindo o estúdio…</p></main></div>

<script>
(function(){
'use strict';
var KEY='arenaTP.estudio.v1',JOGO='arenaTP.jogo.v1';
var S={seen:{},box:{},voice:true,speed:1,cc:true,check:{},auto:true,disc:'dados'};
try{var r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var $=function(s,r){return (r||document).querySelector(s);},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var app=$('#app'),IDX=null,DISC={};
var ICON={portugues:'📜',ingles:'🌐',dados:'🛢️',projetos:'🧭',governanca:'⚓',engsoft:'⚙️',ux:'🧩',bi:'📡',logica:'🔦',seguranca:'🛡️'};
var COR={portugues:'#e8916f',ingles:'#7fc8a0',dados:'#5fd0e0',projetos:'#f2c14e',governanca:'#b9a3ff',engsoft:'#7cc4ec',ux:'#ff9fb6',bi:'#62e3c4',logica:'#ffd166',seguranca:'#ff7b8a'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on');},2400);}
function xp(n){try{var j=JSON.parse(localStorage.getItem(JOGO)||'{}');j.xp=(j.xp||0)+n;j.days=j.days||{};var t=today();j.days[t]=(j.days[t]||0)+n;localStorage.setItem(JOGO,JSON.stringify(j));}catch(e){}}
function getJ(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(u);return r.json();});}
function loadDisc(s){return DISC[s]?Promise.resolve(DISC[s]):getJ('expedicao/'+s+'.json').then(function(o){DISC[s]=o;return o;});}
function loadAll(){return Promise.all(IDX.disciplinas.map(function(d){return loadDisc(d.slug);}));}
function dname(s){var d=IDX.disciplinas.find(function(x){return x.slug===s;});return d?d.nome:s;}

/* ---------- Texto ---------- */
function inline(s){s=esc(s);s=s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/\btec (\d{5,8})/g,'<span class="tec">tec $1</span>');
  s=s.replace(/(Transpetro(?: [A-Za-zÀ-ú.]+)?(?: 20\d\d)(?: NM)?(?:(?: ·)? Q\d+)?)/g,'<mark class="trp">$1</mark>');return s;}
function bare(s){return String(s||'').replace(/`/g,'').replace(/\*\*/g,'');}
function short(s,n){s=bare(s).replace(/\s*\((?:tec|Cesgranrio)[^)]*\)/g,'').replace(/\s+/g,' ').trim();if(s.length<=n)return s;var c=s.slice(0,n);var k=c.lastIndexOf(' ');return (k>n*.6?c.slice(0,k):c).replace(/[,;:.]$/,'')+'…';}
function sentences(t){var out=[],buf='',d=0;t=String(t||'');for(var i=0;i<t.length;i++){var c=t[i];if(c==='('||c==='[')d++;if(c===')'||c===']')d=Math.max(0,d-1);buf+=c;
  if(d===0&&(c===';'||(c==='.'&&t[i+1]===' '&&/[A-ZÀ-Ú"“(]/.test(t[i+2]||'')))){if(buf.trim().length>2)out.push(buf.trim().replace(/;$/,''));buf='';}}if(buf.trim())out.push(buf.trim());return out;}
function speakable(s){return bare(s).replace(/\s*\((?:tec|Cesgranrio|planilha|Gran)[^)]*\)/g,'').replace(/\btec \d+/g,'').replace(/→/g,' leva a ').replace(/×/g,' versus ').replace(/≠/g,' diferente de ').replace(/∩/g,' interseção ').replace(/∪/g,' união ').replace(/∅/g,' vazio ').replace(/¬/g,' não ').replace(/∧/g,' e ').replace(/∨/g,' ou ').replace(/≥/g,' maior ou igual a ').replace(/≤/g,' menor ou igual a ').replace(/\s+/g,' ').trim();}
function md(src){var L=String(src||'').split('\n'),out=[],i=0;
  while(i<L.length){var l=L[i];if(!l.trim()){i++;continue;}
    var h=l.match(/^#{2,4}\s+(.*)/);if(h){out.push('<h4>'+inline(h[1])+'</h4>');i++;continue;}
    if(/^\|/.test(l)){var rows=[];while(i<L.length&&/^\|/.test(L[i])){rows.push(L[i]);i++;}var cells=function(r){return r.replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim();});};var body=rows.slice(1).filter(function(r){return !/^\|[\s:|-]+\|$/.test(r);});
      out.push('<div class="tw"><table><thead><tr>'+cells(rows[0]).map(function(c){return '<th>'+inline(c)+'</th>';}).join('')+'</tr></thead><tbody>'+body.map(function(r){return '<tr>'+cells(r).map(function(c){return '<td>'+inline(c)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>');continue;}
    if(/^\s*([-*]|\d+[.)]) /.test(l)){var it=[];while(i<L.length&&/^\s*([-*]|\d+[.)]) /.test(L[i])){it.push(L[i].replace(/^\s*([-*]|\d+[.)]) /,''));i++;}out.push('<ul>'+it.map(function(x){return '<li>'+inline(x)+'</li>';}).join('')+'</ul>');continue;}
    var p=[];while(i<L.length&&L[i].trim()&&!/^(#{2,4}\s|\||\s*([-*]|\d+[.)]) )/.test(L[i])){p.push(L[i]);i++;}out.push('<p>'+inline(p.join(' '))+'</p>');}
  return '<div class="md">'+out.join('')+'</div>';}
function stepsOf(t){return String(t||'').split(/\s*\(\d+\)\s*/).map(function(x){return x.replace(/;\s*$/,'').trim();}).filter(Boolean);}
function emblem(slug){var c=COR[slug];return '<svg class="emblem" viewBox="0 0 210 210" aria-hidden="true"><defs><radialGradient id="eg'+slug+'" cx="50%" cy="40%"><stop offset="0" stop-color="'+c+'" stop-opacity=".55"/><stop offset="1" stop-color="#fff7ef" stop-opacity="0"/></radialGradient></defs><circle cx="105" cy="105" r="100" fill="url(#eg'+slug+')"/><g class="spin"><circle cx="105" cy="105" r="92" fill="none" stroke="'+c+'" stroke-width="2" stroke-dasharray="4 10"/><circle cx="105" cy="13" r="6" fill="'+c+'"/></g><circle cx="105" cy="105" r="70" fill="#fffaf3" stroke="'+c+'" stroke-width="4"/><text x="105" y="128" text-anchor="middle" font-size="66">'+ICON[slug]+'</text></svg>';}

/* ===================== MOTOR DA VIDEOAULA ===================== */
function Builder(slug,title,kind){this.slug=slug;this.title=title;this.kind=kind;this.scenes=[];this.cues=[];}
Builder.prototype.scene=function(name,cls){this.scenes.push({name:name,cls:cls||'',html:[]});return this;};
function up1(x){x=String(x||'');return x.replace(/([.:!?]\s+|^)([a-zà-ú])/g,function(m,a,b){return a+b.toUpperCase();});}
Builder.prototype.cue=function(text,hold){text=up1(text);this.cues.push({text:speakable(text),cap:short(text,220),s:this.scenes.length-1,hold:hold||0});return this.cues.length-1;};
Builder.prototype.add=function(h){this.scenes[this.scenes.length-1].html.push(h);return this;};
function est(c){return Math.max(2.4,c.text.length/14.5+.7)+(c.hold||0);}

/* Aula de método: um formato de questão */
function lessonFormat(slug,o,i){var f=o.formatos[i],b=new Builder(slug,f.t.replace(/^(?:Formato\s+[\w.]+\s*·\s*|\d+(?:\.\d+)*\s+)/,''),'Método');
  b.scene('Abertura','s-open');var c=b.cue('Videoaula de método. '+o.nome+'. '+b.title+'. Você vai aprender a reconhecer este tipo de questão e a resolvê-la passo a passo, do jeito que a Cesgranrio cobra.',.4);
  b.add('<div class="rv pop" data-c="'+c+'">'+emblem(slug)+'</div><div class="kick rv" data-c="'+c+'">Método de resolução · '+esc(o.nome)+'</div><h2 class="rv" data-c="'+c+'" style="font-size:'+(b.title.length>70?50:(b.title.length>45?62:76))+'px">'+esc(short(b.title,110))+'</h2>');

var KCOL={root:'#0d5b6b',disc:'#0d5b6b',topic:'#33515a',cobra:'#2b7a8a',perg:'#6b55c7',conf:'#b0413a',mac:'#a87300',leaf:'#ffffff'};
function nd(label,kind,kids,full){return {label:label,kind:kind,children:kids||[],open:false,full:full||label};}
function topicNode(slug,t,ti){var trp=/Transpetro/.test(t.peso||'');var k=[];
  if(t.cobra)k.push(nd('O que cobra','cobra',sentences(t.cobra).filter(function(x){return x.length>12;}).slice(0,4).map(function(s){return nd(short(s,70),'leaf-cobra',[],s);})));
  var qt=(t.pergunta||'').match(/"[^"]{6,120}"/g)||[];if(qt.length)k.push(nd('Como pergunta','perg',qt.slice(0,4).map(function(s){return nd(short(s,60),'leaf-perg',[],s);})));
  if(t.confunde)k.push(nd('Onde confunde','conf',sentences(t.confunde).slice(0,4).map(function(s){return nd(short(s,70),'leaf-conf',[],s);})));
  if(t.macete)k.push(nd('Macete','mac',[nd(short(t.macete,90),'leaf-mac',[],t.macete)]));
  var n=nd((trp?'★ ':'')+t.t.replace(/^[\d.]+\s*/,''),'topic',k,t.peso?'Peso: '+t.peso:'');n.lesson='play/'+slug+'/t/'+ti;return n;}
function discNode(o){var n=nd(o.nome,'disc',o.topicos.map(function(t,ti){return topicNode(o.slug,t,ti);}));n.open=true;return n;}
function mapa(slug){nav('mm');var isAll=!slug||slug==='prova';
  app.innerHTML='<header class="hero"><div class="eyebrow">Mapas mentais</div><h2>'+(isAll?'A prova inteira':'Mapa de '+esc(dname(slug)))+'</h2><p class="note">Toque num ramo para abrir ou fechar. Arraste para mover, use a roda do mouse ou o gesto de pinça para ampliar. ★ = já caiu na Transpetro. Toque numa folha para ler o texto completo.</p></header>'+

  '<div class="mmwrap" id="mmw"><svg id="mms" role="img" aria-label="Mapa mental"><g id="mmg"></g></svg><div class="mmtools"><button id="mmin" aria-label="Ampliar">＋</button><button id="mmout" aria-label="Reduzir">－</button><button id="mmfit">Ajustar</button><button id="mmexp">Abrir tópicos</button><button id="mmcol">Fechar</button><button id="mmpng">⬇ PNG</button></div><div class="drawer" id="mmd" hidden></div></div>'+

function MM(root){var svg=$('#mms'),g=$('#mmg'),wrap=$('#mmw'),drawer=$('#mmd');var view={x:30,y:0,k:1};var CH=7.3,GAP=12,COLG=56;
  var cs=getComputedStyle(document.documentElement),INK=cs.getPropertyValue('--ink').trim(),PAPER=cs.getPropertyValue('--paper').trim(),LINE=cs.getPropertyValue('--line').trim();
  function wrapT(s,n){var w=s.split(' '),L=[],cur='';w.forEach(function(x){if((cur+' '+x).trim().length>n&&cur){L.push(cur);cur=x;}else cur=(cur+' '+x).trim();});if(cur)L.push(cur);return L.slice(0,4);}
  function lay(n,d,x,y){var max=d===0?22:(d===1?24:30);n.lines=wrapT(n.label+(n.lazy&&!n.open?'  ('+n.count+')':''),max);n.w=Math.max.apply(null,n.lines.map(function(l){return l.length;}))*CH+(d===0?34:24);n.h=n.lines.length*17+(d===0?20:14);n.d=d;
    var kids=n.open?n.children:[];var cx=x+n.w+COLG;if(!kids.length){n.x=x;n.y=y;return n.h;}
    var cy=y,tot=0;kids.forEach(function(k){var h=lay(k,d+1,cx,cy);cy+=h+GAP;tot+=h+GAP;});tot-=GAP;
    if(tot<n.h){var off=(n.h-tot)/2;kids.forEach(function sh(k){k.y+=off;(k.open?k.children:[]).forEach(sh);});tot=n.h;}
    n.x=x;n.y=y+(tot-n.h)/2;return tot;}
  function col(n){if(n.kind==='root'||n.kind==='disc')return KCOL.disc;if(n.kind==='topic')return KCOL.topic;if(KCOL[n.kind])return KCOL[n.kind];return PAPER;}
  function stroke(n){var k=n.kind.replace('leaf-','');return KCOL[k]||LINE;}
  function draw(){lay(root,0,0,0);var links=[],nodes=[];
    (function walk(n){(n.open?n.children:[]).forEach(function(k){var x1=n.x+n.w,y1=n.y+n.h/2,x2=k.x,y2=k.y+k.h/2,m=(x1+x2)/2;links.push('<path d="M'+x1+','+y1+' C'+m+','+y1+' '+m+','+y2+' '+x2+','+y2+'" fill="none" stroke="'+stroke(k)+'" stroke-opacity=".55" stroke-width="'+(k.d<=1?2.6:1.6)+'"/>');walk(k);});
      var leaf=/^leaf/.test(n.kind),fill=leaf?PAPER:col(n),tc=leaf?INK:'#ffffff';var has=n.children.length||n.lazy;
      nodes.push('<g class="mmn" data-id="'+nodes.length+'" style="cursor:pointer"><rect x="'+n.x+'" y="'+n.y+'" width="'+n.w+'" height="'+n.h+'" rx="'+(n.d===0?14:9)+'" fill="'+fill+'" stroke="'+(leaf?stroke(n):'none')+'" stroke-width="1.5"/>'+
        n.lines.map(function(l,i){return '<text x="'+(n.x+12)+'" y="'+(n.y+(n.d===0?24:19)+i*17)+'" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="'+(n.d===0?15:13)+'" font-weight="'+(n.d<=1||n.kind==='topic'?600:400)+'" fill="'+tc+'">'+esc(l)+'</text>';}).join('')+
        (has?'<circle cx="'+(n.x+n.w)+'" cy="'+(n.y+n.h/2)+'" r="8" fill="'+PAPER+'" stroke="'+(leaf?stroke(n):col(n))+'" stroke-width="2"/><text x="'+(n.x+n.w)+'" y="'+(n.y+n.h/2+4)+'" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, monospace" fill="'+INK+'">'+(n.open?'−':'+')+'</text>':'')+'</g>');
      n._i=nodes.length-1;REG[n._i]=n;})(root);
    g.innerHTML=links.join('')+nodes.join('');apply();}
  var REG=[];
  function apply(){g.setAttribute('transform','translate('+view.x+','+view.y+') scale('+view.k+')');}
  function bbox(){var b=g.getBBox();return b;}
  function fit(){var b=bbox(),W=svg.clientWidth,H=svg.clientHeight;var k=Math.min(1.4,Math.max(.2,Math.min((W-40)/b.width,(H-40)/b.height)));view.k=k;view.x=(W-b.width*k)/2-b.x*k;view.y=(H-b.height*k)/2-b.y*k;apply();}
  function toggle(n){var before={x:n.x*view.k+view.x,y:n.y*view.k+view.y};
    var go=function(){n.open=!n.open;draw();var after={x:n.x*view.k+view.x,y:n.y*view.k+view.y};view.x+=before.x-after.x;view.y+=before.y-after.y;apply();};
    if(n.lazy&&!n.loaded){loadDisc(n.slug).then(function(o){n.children=o.topicos.map(function(t,ti){return topicNode(o.slug,t,ti);});n.loaded=true;n.lazy=false;go();});}else go();}
